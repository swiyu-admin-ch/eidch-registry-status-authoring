spring:
  datasource:
    url: 'jdbc:postgresql://localhost:5431/status-registry-db'
    username: postgres
    password: secret
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: data
  flyway:
    locations:
      - classpath:db/migration/common
security:
  oauth2:
    jwt:
      issuer-uris:
        example: "https://www.example.com"
status-registry:
  dataUrlTemplate: "TEST.DATAURL/{0}.{1}"
  authoringBaseUrl: "http://TEST.AUTHORING.URL"
